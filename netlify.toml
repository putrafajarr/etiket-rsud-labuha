[build]
  publish = "public"
  functions = "netlify/functions"

# Rute semua permintaan API ke Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Rute download file installer APK
[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200
